name: Vercel Production Deployment

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_YnYjiqv2j4c106mr6BorOBFL
  VERCEL_PROJECT_ID: prj_vzRQ7tmPR0id7Ym1lhCgyRfuQqnM

jobs:
  deploy:
    name: Build and deploy canonical insta-floan
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Pull Vercel production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Verify pulled production configuration
        shell: bash
        run: |
          test -s .env.production.local
          # Do not print the secret; only assert that the required RPC exists.
          grep -Eq '^ETH_RPC_URL=.+$' .env.production.local
          # Trading must remain fail-closed in the production build.
          test "$(sed -n 's/^LIVE_EXECUTION=//p' .env.production.local | tail -n 1)" != "true"
          test "$(sed -n 's/^PRODUCTION_EXECUTION_PATH_ENABLED=//p' .env.production.local | tail -n 1)" != "true"
          test "$(sed -n 's/^PRODUCTION_KILL_SWITCH_ENABLED=//p' .env.production.local | tail -n 1)" = "true"

      - name: Build production output
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy production output
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
